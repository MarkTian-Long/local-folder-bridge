name: Local validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --test
      - run: node scripts/smoke.mjs
      - run: node scripts/package-share.mjs

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LocalFolderBridge
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library-only baseline (optional PDF tests may skip)
        run: python tools/run_tests.py --report-dir reports/stdlib
      - name: Install validation dependencies, including the target PDF version
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 pypdf==6.18.1
      - run: python tools/run_tests.py
      - run: python tools/verify_delivery.py
      - run: python tools/package.py ../dist/LocalFolderBridge.zip
      - run: python -m zipfile -e ../dist/LocalFolderBridge.zip ../dist/cleanroom
      - run: python ../dist/cleanroom/LocalFolderBridge/tools/verify_package.py
      - name: Test the extracted distribution, not just the source checkout
        run: python ../dist/cleanroom/LocalFolderBridge/tools/run_tests.py
